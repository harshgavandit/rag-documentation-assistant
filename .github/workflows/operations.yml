name: Read-only operations snapshot

on:
  schedule:
    - cron: '25 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operations-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Collect health and protected aggregates
        env:
          OPS_BASE_URL: ${{ vars.OPS_BASE_URL }}
          OPS_READ_TOKEN: ${{ secrets.OPS_READ_TOKEN }}
        run: python operations/collect.py --public-health-only --output operations/snapshot.json
      - name: Retain public health and schema evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operations-${{ github.run_id }}
          path: operations/snapshot.json
          if-no-files-found: ignore
          retention-days: 30
