name: Tests and retrieval evaluation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: evaluation/requirements.lock.txt
      - name: Install evaluation environment
        run: python -m pip install -r evaluation/requirements.lock.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Prepare checksum-verified public model
        run: python web/prepare.py
      - name: Check syntax
        run: python -m compileall -q web evaluation
      - name: Run offline web and evaluation tests
        run: python -m unittest discover -s web/tests -v
      - name: Verify retained metrics and source snapshots
        run: python -m evaluation.verify_evidence
      - name: Validate frozen multi-domain diagnostic
        run: python -m evaluation.broader --check-build --validate-only --check-encoder
      - name: Measure development query domains without paid providers
        run: python -m evaluation.broader --run-split dev --output evaluation/results/ci-broader-dev.json
      - name: Measure heldout query domains without paid providers
        run: python -m evaluation.broader --run-split heldout --output evaluation/results/ci-broader-heldout.json
      - name: Validate frozen source labels
        run: python -m evaluation.run --validate-only
      - name: Measure retrieval without paid providers
        run: python -m evaluation.run --output evaluation/results/ci-retrieval.json --repeats 3 --warmup-rounds 1
      - name: Validate expanded source labels
        run: python -m evaluation.run --dataset evaluation/cases_v2.json --validate-only
      - name: Measure expanded retrieval without paid providers
        run: python -m evaluation.run --dataset evaluation/cases_v2.json --output evaluation/results/ci-retrieval-v2.json --repeats 3 --warmup-rounds 1
      - name: Retain retrieval evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: retrieval-${{ github.sha }}
          path: |
            evaluation/results/ci-retrieval*.json
            evaluation/results/ci-broader*.json
            evaluation/results/sources/ci-broader-*
          if-no-files-found: error
          retention-days: 30
